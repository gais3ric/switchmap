{% from "_icons.html" import icon %}<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ code }} · SwitchMap</title>
<script nonce="{{ csp_nonce }}">
(function () {
    var t = null;
    try { t = localStorage.getItem('switchmap.theme'); } catch (e) {}
    document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark';
})();
</script>
<link rel="stylesheet" href="/static/ui.css">
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="empty card" style="max-width:440px;width:100%">
        {{ icon('alert') }}
        <h3>{{ {403: _('Нет доступа'), 404: _('Не найдено'), 400: _('Запрос отклонён')}.get(code, _('Ошибка')) }} <span class="muted">· {{ code }}</span></h3>
        <p>{{ message }}</p>
        <div class="row" style="margin-top:6px">
            <button type="button" class="btn" data-click="goBack">{{ _('Назад') }}</button>
            <a href="/" class="btn btn-primary">{{ _('На главную') }}</a>
        </div>
    </div>
</main>
</body>
</html>
